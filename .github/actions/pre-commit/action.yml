name: Run pre-commit
description: >-
  Runs the repo's pre-commit hooks, minus the ones a suite does not own.
  Hooks stay defined once in .pre-commit-config.yaml, so CI and local runs
  can't drift. Inlined rather than pre-commit/action@v3.0.1, whose pinned
  actions/cache@v4 runs on the deprecated Node 20.

inputs:
  skip:
    description: >-
      Comma-separated hook ids this suite does not run. Exclusion rather than
      inclusion is deliberate: a newly added hook runs everywhere until it is
      explicitly skipped, which fails loud instead of silently going unchecked.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Cache pre-commit environments
      uses: actions/cache@v6
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

    - name: Run pre-commit
      shell: bash
      env:
        SKIP: ${{ inputs.skip }}
      run: uvx pre-commit run --all-files --show-diff-on-failure --color=always
