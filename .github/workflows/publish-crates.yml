name: Publish to crates.io

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: read

# Never let two releases publish concurrently.
concurrency:
  group: publish-crates
  cancel-in-progress: false

env:
  # dagron-core and dagron-ui are independent — neither depends on the other —
  # so publish order does not matter and no index-propagation wait is needed.
  CRATES: dagron-core dagron-ui

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates.io
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check version declarations agree
        id: version
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            python scripts/check_versions.py --expect "$GITHUB_REF_NAME"
          else
            python scripts/check_versions.py
          fi
          version=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('Cargo.toml').read_text())['workspace']['package']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Builds each crate from its packaged tarball; `cargo publish` below then
      # skips the identical rebuild via --no-verify.
      - name: Package and verify crates
        run: cargo package --locked -p dagron-core -p dagron-ui

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_TOKEN is not set in the 'crates.io' environment"
            exit 1
          fi

          # Re-running a release must be a no-op for versions already up.
          already_published() {
            local crate=$1 code
            code=$(curl -sS -o /tmp/crate.json -w '%{http_code}' \
              -H "User-Agent: dagron-release (github.com/ByteVeda/dagron)" \
              "https://crates.io/api/v1/crates/$crate")
            case "$code" in
              200) jq -e --arg v "$VERSION" 'any(.versions[]?; .num == $v)' /tmp/crate.json >/dev/null ;;
              404) return 1 ;;  # crate not on crates.io yet
              *)   echo "::error::crates.io returned HTTP $code for $crate"; exit 1 ;;
            esac
          }

          for crate in $CRATES; do
            if already_published "$crate"; then
              echo "$crate $VERSION already on crates.io — skipping"
              continue
            fi
            echo "Publishing $crate $VERSION"
            cargo publish --locked --no-verify -p "$crate"
          done
