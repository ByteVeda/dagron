name: CI Release readiness

# Reusable workflow: everything that has to hold before a tag can be
# released, checked on PRs so it is never discovered at release time.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  readiness:
    name: Release readiness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Set up Python
        uses: ./.github/actions/setup-python
        with:
          # Only the stdlib is needed: check_versions.py has no dependencies
          # and the sdist is compiled into its own throwaway environment.
          sync: "false"

      - name: Check version declarations agree
        run: python scripts/check_versions.py

      - name: Verify crates are publishable
        run: cargo publish -p dagron-core -p dagron-ui --dry-run

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: ./.github/actions/verify-sdist
